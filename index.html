function loadDB(){
 try{
  const raw=localStorage.getItem(STORAGE_KEY);
  if(!raw)return structuredClone(seed);
  const parsed=JSON.parse(raw);
  const clean={};
  Object.keys(seed).forEach(k=>clean[k]=Array.isArray(parsed[k])?parsed[k]:structuredClone(seed[k]));
  return clean;
 }catch(e){console.warn('Không đọc được dữ liệu cũ, dùng dữ liệu demo.',e);return structuredClone(seed)}
}
function saveDB(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return true}
 catch(e){console.error(e);toast('Không thể lưu dữ liệu. Hãy xuất bản sao lưu và giải phóng dung lượng trình duyệt.');return false}
}
function validateBackup(x){
 const required=['members','departments','activities','tasks','events','achievements','finance','announcements','pointTransactions'];
 if(!x||typeof x!=='object'||required.some(k=>!Array.isArray(x[k])))throw Error('File thiếu dữ liệu bắt buộc hoặc không đúng định dạng STEM HUB.');
 if(x.members.some(m=>!m||typeof m.id!=='string'||typeof m.name!=='string'))throw Error('Danh sách thành viên không hợp lệ.');
 if(x.tasks.some(t=>!t||typeof t.id!=='string'||typeof t.title!=='string'))throw Error('Danh sách nhiệm vụ không hợp lệ.');
 if(x.finance.some(f=>!f||typeof f.id!=='string'||!Number.isFinite(Number(f.amount))))throw Error('Dữ liệu tài chính không hợp lệ.');
 return true;
}

 if(kind==='event'){arrKey='events';set();title=id?'Chỉnh sửa sự kiện':'Tạo sự kiện';fields=formField('Tên sự kiện','name',get('name'))+formField('Ngày tổ chức','date',get('date')||new Date().toISOString().slice(0,10),'date')+formField('Địa điểm','location',get('location')||'THPT Chuyên Thái Nguyên')+formField('Trạng thái','status',get('status')||'Đang chuẩn bị','select',['Đang chuẩn bị','Đang diễn ra','Đã hoàn thành','Đã hủy'])+formField('Số người tham gia','participants',get('participants')||0,'number')+formField('Nhân sự BTC','staff',get('staff')||0,'number')+formField('Ngân sách dự kiến (VND)','budget',get('budget')||0,'number')+formField('Tiến độ (%)','progress',get('progress')??0,'number')}
 if(kind==='achievement'){arrKey='achievements';set();title=id?'Chỉnh sửa thành tích':'Thêm thành tích';fields=formField('Tên thành tích','title',get('title'))+formField('Thành viên','memberId',get('memberId')||memberIdOpts[0],'select',memberIdOpts)+formField('Cấp độ','level',get('level')||'CLB','select',['CLB','Trường','Cấp tỉnh','Cấp quốc gia','Quốc tế','Nội bộ'])+formField('Ngày ghi nhận','date',get('date')||new Date().toISOString().slice(0,10),'date')+formField('Mô tả','description',get('description')||'','textarea',null,true,false)}
 if(kind==='finance'){arrKey='finance';set();title=id?'Chỉnh sửa giao dịch':'Ghi giao dịch tài chính';fields=formField('Nội dung','title',get('title'))+formField('Ngày giao dịch','date',get('date')||new Date().toISOString().slice(0,10),'date')+formField('Loại giao dịch','type',get('type')||'Chi','select',['Thu','Chi'])+formField('Số tiền (VND)','amount',get('amount')||0,'number')+formField('Danh mục','category',get('category')||'Khác','select',['Tài trợ','Truyền thông','Thiết bị','Vận hành','Đào tạo','Khác'])+formField('Trạng thái','status',get('status')||'Chờ duyệt','select',['Chờ duyệt','Đã xác nhận','Đã hủy'])+formField('Sự kiện liên quan','event',get('event')||'','text',null,false,false)}
 if(kind==='announcement'){arrKey='announcements';set();title=id?'Chỉnh sửa thông báo':'Tạo thông báo';fields=formField('Tiêu đề','title',get('title'))+formField('Loại thông báo','type',get('type')||'Hoạt động','select',['Quan trọng','Hoạt động','Deadline','Nội bộ'])+formField('Ngày đăng','date',get('date')||new Date().toISOString().slice(0,10),'date')+formField('Nội dung','body',get('body')||'','textarea',null,true)}
 document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=`<div class="formgrid">${fields}</div>`;document.getElementById('modalback').classList.add('open');document.getElementById('modalForm').onsubmit=(e)=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());if(kind==='point'){const val=Number(data.points);if(!val||!Number.isFinite(val))return toast('Điểm phải là số khác 0.');if(!member(data.memberId))return toast('Hãy chọn thành viên hợp lệ.');db.pointTransactions.push({id:nextId('P',db.pointTransactions),memberId:data.memberId,points:val,reason:data.reason,date:new Date().toISOString().slice(0,10),status:'Đã xác nhận'});saveDB();closeModal();render();toast('Đã ghi nhận giao dịch điểm.');return}if(['participants','staff','budget','progress','points','amount'].some(k=>k in data))for(const k of ['participants','staff','budget','progress','points','amount'])if(k in data)data[k]=Number(data[k]);
 if(kind==='finance'&&(!Number.isFinite(data.amount)||data.amount<=0))return toast('Số tiền phải lớn hơn 0.');
 if(kind==='event'&&(data.progress<0||data.progress>100))return toast('Tiến độ phải nằm trong khoảng 0–100%.');
 if(kind==='task'&&data.points<0)return toast('Điểm thưởng không được âm.');
 if(id){const target=db[arrKey].find(x=>x.id===id);if(!target)return toast('Không tìm thấy bản ghi cần sửa.');
  if(kind==='task'&&target.status==='Hoàn thành'&&data.status!=='Hoàn thành'&&db.pointTransactions.some(p=>p.sourceTask===id))return toast('Nhiệm vụ đã chốt điểm; không thể chuyển trạng thái để tránh sai lệch sổ điểm.');
  if(kind==='task'&&data.status==='Hoàn thành'&&target.status!=='Hoàn thành')data.status='Chờ duyệt';
  Object.assign(target,data)
 }else{data.id=nextId(({members:'STEM',departments:'D',activities:'A',tasks:'T',events:'E',achievements:'AC',finance:'F',announcements:'N'})[arrKey],db[arrKey]);if(kind==='task'&&data.status==='Hoàn thành')data.status='Chờ duyệt';db[arrKey].push(data)}saveDB();closeModal();render();toast(id?'Đã cập nhật dữ liệu.':'Đã thêm dữ liệu thành công.')}
}
function closeModal(){document.getElementById('modalback').classList.remove('open')}
function removeItem(key,id){const allowed=key==='finance'||key==='members'||key==='departments'||key==='pointTransactions'?['admin']:['admin','leader'];if(!requireRole(allowed))return;if(!confirm('Bạn chắc chắn muốn xóa bản ghi này?'))return;db[key]=db[key].filter(x=>x.id!==id);saveDB();render();toast('Đã xóa bản ghi.')}
function memberDetails(id){const m=member(id);if(!m)return;const tx=db.pointTransactions.filter(p=>p.memberId===id);alert(`HỒ SƠ THÀNH VIÊN\n\n${m.name}\nMã: ${m.id}\nLớp: ${m.className}\nBan: ${m.department}\nChức vụ: ${m.role}\nGen: ${m.gen}\nTrạng thái: ${m.status}\nEmail: ${m.email||'—'}\nNgày gia nhập: ${dateVN(m.joined)}\n\nĐiểm tổng: ${points(id)}\nGiao dịch điểm: ${tx.length}\nNhiệm vụ: ${db.tasks.filter(t=>t.assignee===id).length}\nThành tích: ${db.achievements.filter(a=>a.memberId===id).length}`)}
function departmentMembers(name){nav('members');memberFilter=name;render()}
function exportCSV(type){let headers,rows,filename;if(type==='members'){headers=['Mã thành viên','Họ tên','Lớp','Ban','Chức vụ','Gen','Trạng thái','Email','Điểm'];rows=db.members.map(m=>[m.id,m.name,m.className,m.department,m.role,m.gen,m.status,m.email,points(m.id)])}else{headers=['Loại báo cáo','Giá trị'];rows=[['Tổng thành viên',db.members.length],['Thành viên hoạt động',db.members.filter(m=>m.status==='Đang hoạt động').length],['Hoạt động',db.activities.length],['Nhiệm vụ',db.tasks.length],['Nhiệm vụ hoàn thành',db.tasks.filter(t=>t.status==='Hoàn thành').length],['Tổng điểm',allPoints()],['Thu đã xác nhận',db.finance.filter(f=>f.status==='Đã xác nhận'&&f.type==='Thu').reduce((s,f)=>s+f.amount,0)],['Chi đã xác nhận',db.finance.filter(f=>f.status==='Đã xác nhận'&&f.type==='Chi').reduce((s,f)=>s+f.amount,0)]]}const csv=[headers,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');downloadBlob('\ufeff'+csv, type==='members'?'stemhub_thanh_vien.csv':'stemhub_bao_cao.csv','text/csv;charset=utf-8');toast('Đã xuất file CSV.')}
function downloadBlob(data,name,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function backupData(){downloadBlob(JSON.stringify(db,null,2),'stemhub_backup_'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Đã tạo bản sao lưu JSON.')}
function restoreData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);validateBackup(x);if(!confirm('Khôi phục sẽ thay thế toàn bộ dữ liệu hiện tại. Bạn đã sao lưu dữ liệu cũ chưa? Tiếp tục?'))return;db={...structuredClone(seed),...x};if(!saveDB())return;nav('dashboard');toast('Đã kiểm tra và khôi phục dữ liệu.')}catch(err){alert('Không thể khôi phục: '+err.message)}finally{e.target.value=''}};r.readAsText(f)}
function generateDemoData(){if(!requireRole(['admin'],'Chỉ Quản trị viên được tạo dữ liệu demo.'))return;const target=80;departmentsSeed.forEach(d=>{if(!db.departments.some(x=>x.name===d.name))db.departments.push(structuredClone(d))});const first=['Minh','Hoàng','Ngọc','Khánh','Quang','Thu','Hải','Phương','Gia','Đức','Bảo','Anh','Tuấn','Mai','Huyền','Trung','Thảo','Thanh','Đăng','Linh','Nhật','Kim','Vân','Trí','Diệu','Duy','Tú','Hiếu','Yến','Long'];const last=['Nguyễn','Trần','Lê','Phạm','Hoàng','Vũ','Đặng','Bùi','Đỗ','Ngô','Dương','Lý','Mai','Đinh','Hồ'];const classes=['10 Tin','10 Toán','10 Lý','10 Hóa','10 Anh','10 Sinh','11 Tin','11 Toán','11 Lý','11 Anh','11 Sinh','12 Tin','12 Toán','12 Anh'];const deps=db.departments.filter(d=>d.name!=='Ban Chủ nhiệm');let count=0;while(db.members.length<target){const i=db.members.length+1;const name=last[Math.floor(Math.random()*last.length)]+' '+first[Math.floor(Math.random()*first.length)]+' '+first[Math.floor(Math.random()*first.length)];const dep=deps[(i-1)%deps.length];const id='STEM'+String(i).padStart(3,'0');db.members.push({id,name,className:classes[(i-1)%classes.length],department:dep.name,role:i%11===0?'Phó ban':'Thành viên',gen:['Gen 2','Gen 3','Gen 4','Gen 5'][(i-1)%4],status:i%13===0?'Tạm nghỉ':'Đang hoạt động',email:'thanhvien'+i+'@demo.stemhub.local',joined:'2026-'+String(1+(i%9)).padStart(2,'0')+'-'+String(1+(i%27)).padStart(2,'0')});count++}const taskNames=['Chuẩn bị thiết bị workshop','Thiết kế bài đăng truyền thông','Kiểm kê dụng cụ STEM','Tổng hợp danh sách đăng ký','Viết biên bản họp ban','Chuẩn bị vật tư robotics','Hỗ trợ hoạt động trải nghiệm','Cập nhật tài liệu chuyên môn','Lập checklist sự kiện','Tổng kết và đánh giá hoạt động'];while(db.tasks.length<55){const i=db.tasks.length+1,m=db.members[(i*7)%db.members.length],d=m.department;db.tasks.push({id:'T'+String(i).padStart(3,'0'),title:taskNames[i%taskNames.length]+' #'+i,assignee:m.id,department:d,due:'2026-10-'+String(10+(i%20)).padStart(2,'0'),points:[5,10,15,20][i%4],status:['Đang thực hiện','Chờ duyệt','Hoàn thành'][i%3],activity:['STEM DAY 2026','Workshop Robotics','Training Arduino','Sinh hoạt CLB'][i%4]})}while(db.activities.length<18){const i=db.activities.length+1;db.activities.push({id:'A'+String(i).padStart(3,'0'),title:['Sinh hoạt CLB định kỳ','Training kỹ năng STEM','Workshop Robotics','Buổi chia sẻ dự án'][i%4]+' #'+i,type:['Sinh hoạt','Training','Workshop','Chuyên môn'][i%4],date:'2026-10-'+String(10+(i%20)).padStart(2,'0'),location:['Phòng STEM','Phòng học bộ môn','Hội trường'][i%3],lead:db.members[i%db.members.length].name,status:['Đã lên lịch','Đang chuẩn bị','Đã hoàn thành'][i%3],participants:8+(i*3)%40})}while(db.pointTransactions.length<100){const i=db.pointTransactions.length+1,m=db.members[(i*5)%db.members.length];db.pointTransactions.push({id:'P'+String(i).padStart(3,'0'),memberId:m.id,points:i%9===0?-5:[5,10,15,20][i%4],reason:i%9===0?'Trừ điểm demo: nộp muộn':'Đóng góp nhiệm vụ demo',date:'2026-10-'+String(1+(i%9)).padStart(2,'0'),status:'Đã xác nhận'})}while(db.achievements.length<20){const i=db.achievements.length+1,m=db.members[(i*3)%db.members.length];db.achievements.push({id:'AC'+String(i).padStart(3,'0'),title:['Thành viên tích cực','Đóng góp chuyên môn','Hoàn thành nhiệm vụ xuất sắc','Gương mặt truyền thông'][i%4]+' #'+i,memberId:m.id,level:['CLB','Nội bộ','Cấp trường'][i%3],date:'2026-10-'+String(1+(i%9)).padStart(2,'0'),description:'Dữ liệu minh họa phục vụ kiểm thử và trình diễn STEM HUB.'})}saveDB();render();toast('Đã tạo dữ liệu demo: '+db.members.length+' thành viên, '+db.tasks.length+' nhiệm vụ, '+db.activities.length+' hoạt động, '+db.pointTransactions.length+' giao dịch điểm.');} 
function resetDemo(){if(!requireRole(['admin']))return;if(!confirm('Khôi phục dữ liệu demo ban đầu? Mọi thay đổi hiện tại sẽ mất.'))return;db=structuredClone(seed);saveDB();demoRole='admin';localStorage.setItem('stemhub_demo_role','admin');nav('dashboard');toast('Đã khôi phục dữ liệu demo ban đầu.')}
function clearData(){if(!requireRole(['admin']))return;if(!confirm('Xóa toàn bộ dữ liệu lưu trong trình duyệt? Hãy xác nhận lần nữa.'))return;if(!confirm('Thao tác này không thể hoàn tác nếu chưa sao lưu. Tiếp tục?'))return;localStorage.removeItem(STORAGE_KEY);db={members:[],tasks:[],pointTransactions:[],activities:[],events:[],achievements:[],finance:[],announcements:[],departments:[]};saveDB();nav('dashboard');toast('Đã xóa dữ liệu local.')}
updateRoleUI();render();
